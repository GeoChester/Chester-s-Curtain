<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Cheshire Curtain</title>
<style>
  html, body {
    margin: 0; height: 100%;
    background: #000;
    overflow: hidden;
    touch-action: none;                 /* phones: a finger drag moves the light and the pieces, it never scrolls */
    -webkit-touch-callout: none;
    -webkit-user-select: none; user-select: none;
  }

  /* Everything puzzle-related lives in #stage. A soft circular mask, centred on the
     cursor (or finger), is the only thing that makes it visible. */
  #stage {
    position: fixed; inset: 0;
    --x: -999px; --y: -999px; --r: 0px;
    -webkit-mask-image: radial-gradient(circle var(--r) at var(--x) var(--y),
        #000 0%, rgba(0,0,0,.92) 55%, rgba(0,0,0,0) 100%);
            mask-image: radial-gradient(circle var(--r) at var(--x) var(--y),
        #000 0%, rgba(0,0,0,.92) 55%, rgba(0,0,0,0) 100%);
  }
  #stage.open { -webkit-mask-image: none; mask-image: none; }   /* the curtain is gone */

  #guide { position: absolute; left: 0; top: 0; pointer-events: none; }
  .piece { position: absolute; left: 0; top: 0; pointer-events: none; will-change: transform; }
  .piece.drag { filter: drop-shadow(0 8px 12px rgba(0,0,0,.75)); }
  .piece.snap { transition: transform .12s ease-out; }
  #final {
    position: absolute; opacity: 0; pointer-events: none; z-index: 100;
    transition: opacity 1.4s ease;
    box-shadow: 0 0 46px rgba(150,100,255,.65);
  }

  /* The coordinates, shown only once the picture is complete. */
  #coords {
    position: fixed; left: 0; right: 0; z-index: 200;
    display: flex; flex-wrap: wrap; justify-content: center; gap: 0 1.4em;
    text-align: center;
    font: bold clamp(18px, min(5vw, 5vh), 44px) Georgia, "Times New Roman", serif;
    letter-spacing: .04em;
    color: #7dffa6; text-shadow: 0 0 10px #7dffa6, 0 0 28px #1fe05a;
    opacity: 0; transition: opacity 1.6s ease; pointer-events: none;
  }
  #coords div:nth-child(2) { color: #c79bff; text-shadow: 0 0 10px #b967ff, 0 0 28px #7a2cff; }
  #cK svg { display: block; height: clamp(46px, min(15vw, 10.5vh), 104px); width: auto; filter: drop-shadow(0 0 8px rgba(255,200,90,.85)); }
  @media (orientation: portrait) { #cK { flex-basis: 100%; display: flex; justify-content: center; margin-top: .5em; } }
  #coords.show { opacity: 1; }

  /* The cat's speech bubble, placed by layout() in the picture's top-right, clear of the moon. */
  #bubble {
    position: fixed; z-index: 150; box-sizing: border-box; pointer-events: none;
    padding: .5em .7em .55em; border-radius: 1em;
    background: #fff9ec; color: #2a1c3a; text-align: center; text-wrap: balance;
    font: italic bold 16px/1.2 Georgia, "Times New Roman", serif;
    box-shadow: 0 4px 16px rgba(0,0,0,.55), 0 0 22px rgba(255,235,170,.35);
    opacity: 0; transform: scale(.85) translateY(6px); transform-origin: 10% 100%;
    transition: opacity .7s ease, transform .7s cubic-bezier(.2,1.4,.4,1);
  }
  #bubble::after {
    content: ""; position: absolute; left: 9%; bottom: -.85em; width: 1.2em; height: .9em;
    background: #fff9ec; clip-path: polygon(0 0, 100% 0, 0 100%);
  }
  #bubble.show { opacity: 1; transform: none; }


  #hint {
    position: fixed; left: 0; right: 0; bottom: 5vh; text-align: center;
    font: 16px/1.4 Georgia, "Times New Roman", serif; color: #5a4690;
    letter-spacing: .05em; pointer-events: none; transition: opacity 1.2s ease;
  }
  #hint.gone { opacity: 0; }
</style>
</head>
<body>

<div id="stage">
  <canvas id="guide"></canvas>
  <img id="final" alt="">
</div>

<div id="coords">
  <div id="cN"></div>
  <div id="cW"></div>
  <div id="cK"><svg viewBox="0 0 64 80" role="img" aria-label="A padlock showing a four-digit code"><path d="M16 36V24a16 16 0 0 1 32 0v12" fill="none" stroke="#ffd36b" stroke-width="5" stroke-linecap="round"/><rect x="6" y="34" width="52" height="42" rx="7" fill="#2a1c06" stroke="#ffd36b" stroke-width="3"/><text id="cL" x="32" y="62" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="18" letter-spacing="0" textLength="42" lengthAdjust="spacingAndGlyphs" fill="#ffe9a8"></text></svg></div>
</div>

<div id="bubble" aria-live="polite"></div>


<div id="hint">Move your light across the dark&hellip;</div>

    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;

  };

const rand = mulberry32(20261007);

// ---------- jigsaw edges (unit space: one cell = 1) ----------
// Each inner edge is drawn once, so the tab of one piece fits the blank of its neighbour exactly.
function makeEdge(x0, y0, x1, y1, nx, ny, s) {
  const ux = x1 - x0, uy = y1 - y0;
  const t = 0.085 + rand() * 0.015;
  const j = () => (rand() - 0.5) * 0.06;
  const a = j(), b = j(), cc = j(), d = j(), e = j();
  const P = (l, w) => [x0 + ux * l + nx * w * s, y0 + uy * l + ny * w * s];
  return [P(0, 0), P(0.2, a), P(0.5 + b + d, -t + cc), P(0.5 - t + b, t + cc),
          P(0.5 - 2 * t + b - d, 3 * t + cc), P(0.5 + 2 * t + b - d, 3 * t + cc), P(0.5 + t + b, t + cc),
          P(0.5 + b + d, -t + cc), P(0.8, e), P(1, 0)];
}
const Hs = [], Vs = [];
for (let rr = 1; rr < N; rr++) { Hs[rr] = []; for (let cl = 0; cl < N; cl++) Hs[rr][cl] = makeEdge(cl, rr, cl + 1, rr, 0, 1, rand() < 0.5 ? 1 : -1); }
for (let rr = 0; rr < N; rr++) { Vs[rr] = []; for (let cl = 1; cl < N; cl++) Vs[rr][cl] = makeEdge(cl, rr, cl, rr + 1, 1, 0, rand() < 0.5 ? 1 : -1); }

function buildPath(p) {
  const ox = p.col * c - pad, oy = p.r * c - pad;
  const X = q => q[0] * c - ox, Y = q => q[1] * c - oy;
  const path = new Path2D();
  const seg = (pts, reverse) => {
    const q = reverse ? pts.slice().reverse() : pts;
    for (let i = 0; i < 9; i += 3)
      path.bezierCurveTo(X(q[i + 1]), Y(q[i + 1]), X(q[i + 2]), Y(q[i + 2]), X(q[i + 3]), Y(q[i + 3]));
  };
  path.moveTo(pad, pad);
  if (p.r === 0) path.lineTo(pad + c, pad); else seg(Hs[p.r][p.col], false);                     // top
  if (p.col === N - 1) path.lineTo(pad + c, pad + c); else seg(Vs[p.r][p.col + 1], false);       // right
  if (p.r === N - 1) path.lineTo(pad, pad + c); else seg(Hs[p.r + 1][p.col], true);              // bottom
  if (p.col === 0) path.lineTo(pad, pad); else seg(Vs[p.r][p.col], true);                        // left

}

function drawPiece(p) {
  const size = c + 2 * pad;
  p.el.width = Math.round(size * dpr); p.el.height = Math.round(size * dpr);
  p.el.style.width = size + "px"; p.el.style.height = size + "px";
  p.path = buildPath(p);
  const g = p.el.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, size, size);
  g.save(); g.clip(p.path);
  g.drawImage(img, -(p.col * c - pad), -(p.r * c - pad), S, S);
  g.restore();
  g.lineJoin = "round";
  g.lineWidth = 1.6; g.strokeStyle = "rgba(0,0,0,.5)"; g.stroke(p.path);
  g.lineWidth = 0.8; g.strokeStyle = "rgba(255,255,255,.28)"; g.stroke(p.path);
}

function drawGuide() {
  guide.width = Math.round(W * dpr); guide.height = Math.round(H * dpr);
  guide.style.width = W + "px"; guide.style.height = H + "px";
  const g = guide.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.fillStyle = "rgba(120,70,220,.12)"; g.fillRect(bx, by, S, S);
  g.strokeStyle = "rgba(185,140,255,.6)"; g.lineWidth = 2; g.strokeRect(bx, by, S, S);
  g.strokeStyle = "rgba(185,140,255,.24)"; g.lineWidth = 1; g.setLineDash([6, 6]);
  for (let i = 1; i < N; i++) {
    g.beginPath(); g.moveTo(bx + i * c, by); g.lineTo(bx + i * c, by + S); g.stroke();
    g.beginPath(); g.moveTo(bx, by + i * c); g.lineTo(bx + S, by + i * c); g.stroke();
  }
}

function place(p) {
  p.el.style.transform = "translate(" + p.x + "px," + p.y + "px)";
  p.el.style.zIndex = p.z;
}

function scatter() {
  const size = c + 2 * pad, m = size / 2;
  pieces.forEach(p => {
    let cx, cy, tries = 0;
    do {
      cx = m + Math.random() * Math.max(1, W - 2 * m);
      cy = m + Math.random() * Math.max(1, H - 2 * m);
      tries++;
    } while (tries < 80 && cx > bx - c * 0.1 && cx < bx + S + c * 0.1 && cy > by - c * 0.1 && cy < by + S + c * 0.1);
    p.x = cx - size / 2; p.y = cy - size / 2;
  });
}

function layout(first) {
  const oldW = W, oldH = H;
  W = window.innerWidth; H = window.innerHeight;
  dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  S = Math.floor(Math.min(W * 0.9, H * 0.70));
  c = S / N; pad = Math.ceil(c * 0.32);
  bx = Math.round((W - S) / 2);
  by = Math.round((H - S) / 2 - H * 0.04);
  RADIUS = Math.max(110, Math.min(220, c * RADIUS_FACTOR));
  if (!done && targetR > 0) targetR = RADIUS;

  drawGuide();
  finalImg.style.left = bx + "px"; finalImg.style.top = by + "px";
  finalImg.style.width = S + "px"; finalImg.style.height = S + "px";
  coords.style.top = (by + S + Math.max(10, H * 0.025)) + "px";
  bubble.style.left = Math.round(bx + S * 0.58) + "px"; bubble.style.top = Math.round(by + S * 0.04) + "px";
  bubble.style.width = Math.round(S * 0.38) + "px"; bubble.style.fontSize = Math.max(12, S * 0.047).toFixed(1) + "px";

  pieces.forEach(p => {
    drawPiece(p);
    if (p.locked) { p.x = bx + p.col * c - pad; p.y = by + p.r * c - pad; }
    else if (!first) { p.x *= W / oldW; p.y *= H / oldH; }
  });
  if (first) scatter();
  pieces.forEach(place);
}

// ---------- the light ----------
function setLight(e) {
  tx = e.clientX; ty = e.clientY;
  if (!done) targetR = RADIUS;
  if (r < 1) { x = tx; y = ty; }
  hint.classList.add("gone");
}
function hideLight() { if (!done && !drag) targetR = 0; }

function frame() {
  const moving = Math.abs(tx - x) > 0.05 || Math.abs(ty - y) > 0.05 || Math.abs(targetR - r) > 0.05;
  if (moving) {
    x += (tx - x) * 0.3; y += (ty - y) * 0.3;
    r += (targetR - r) * 0.18;
    if (targetR === 0 && r < 0.5) r = 0;
    stage.style.setProperty("--x", x + "px");
    stage.style.setProperty("--y", y + "px");
    stage.style.setProperty("--r", r + "px");
    if (done && r > targetR * 0.97) stage.classList.add("open");
  }
  requestAnimationFrame(frame);
}

// ---------- dragging ----------
function pick(e) {
  if (done || (e.pointerType === "mouse" && e.button !== 0)) return;
  const px = e.clientX, py = e.clientY;
  const order = pieces.filter(p => !p.locked).sort((a, b) => b.z - a.z);
  for (const p of order) {
    if (hitCtx.isPointInPath(p.path, px - p.x, py - p.y)) {
      drag = { p, dx: px - p.x, dy: py - p.y };
      p.z = ++zTop; place(p);
      p.el.classList.add("drag");
      document.body.style.cursor = "grabbing";
      break;
    }
  }
}
function moveDrag(e) {
  if (!drag) return;
  const p = drag.p, half = (c + 2 * pad) / 2;
  p.x = Math.max(-half, Math.min(W - half, e.clientX - drag.dx));
  p.y = Math.max(-half, Math.min(H - half, e.clientY - drag.dy));
  place(p);
}
function endDrag() {
  if (!drag) return;
  const p = drag.p; drag = null;
  p.el.classList.remove("drag");
  document.body.style.cursor = "";
  const gx = bx + p.col * c - pad, gy = by + p.r * c - pad;
  if (Math.hypot(p.x - gx, p.y - gy) < c * SNAP) {
    p.x = gx; p.y = gy; p.locked = true; p.z = 1;
    p.el.classList.add("snap"); place(p);
    setTimeout(() => p.el.classList.remove("snap"), 200);
    if (pieces.every(q => q.locked)) complete();
  }
}

//CODEC-START
function fnv(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}return h>>>0;}
function stream(seed){let a=seed>>>0;return function(){a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)&255;};}
function unlock(b64,phrase){const raw=atob(b64);const next=stream(fnv(phrase));const out=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)out[i]=raw.charCodeAt(i)^next();return new TextDecoder().decode(out);}

const PAYLOAD = 'odA18rRilYiyKN8JhZ+37Pr4cmrxtU8JwS/xvg6RvmBc7YgveIpN6lAPGQ8XwH3/N1J/5l1CRVRMbz2xJjWYjQ==', PHRASE = 'cheshirecurtain|1';
function fillCoords() {
  let t = ''; try { t = unlock(PAYLOAD, PHRASE); } catch (e) { t = ''; }
  const p = t.split('\n');
  document.getElementById("cN").textContent = p[0] || '';
  document.getElementById("cW").textContent = p[1] || '';
  document.getElementById("cL").textContent = p[2] || '';
  bubble.textContent = p[3] || '';
}

function complete() {
  done = true;
  fillCoords();
  targetR = Math.hypot(W, H) * 2.2;               // the curtain lifts: the light grows to cover everything
  setTimeout(() => { finalImg.style.opacity = 1; }, 500);   // the seamless picture fades in over the pieces
  setTimeout(() => { coords.classList.add("show"); }, 1100);
  setTimeout(() => { bubble.classList.add("show"); }, 1900);
}

window.addEventListener("pointermove", e => { setLight(e); moveDrag(e); });
window.addEventListener("pointerdown", e => { setLight(e); pick(e); });
window.addEventListener("pointerup", e => { endDrag(); if (e.pointerType !== "mouse") hideLight(); });
window.addEventListener("pointercancel", () => { endDrag(); hideLight(); });
document.addEventListener("mouseleave", hideLight);
window.addEventListener("blur", () => { endDrag(); hideLight(); });
window.addEventListener("resize", () => layout(false));

img.onload = () => {
  finalImg.src = IMG_SRC;
  for (let rr = 0; rr < N; rr++) for (let cl = 0; cl < N; cl++) {
    const el = document.createElement("canvas");
    el.className = "piece";
    stage.insertBefore(el, finalImg);
    pieces.push({ r: rr, col: cl, el, x: 0, y: 0, z: 10 + rr * N + cl, locked: false, path: null });
  }
  // shuffle which pieces sit on top
  pieces.map(p => [Math.random(), p]).sort((a, b) => a[0] - b[0]).forEach((q, i) => { q[1].z = 10 + i; });
  zTop = 10 + pieces.length;
  layout(true);
  frame();
};
img.src = IMG_SRC;
</script>
